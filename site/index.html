<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Paragraphs by Jonathan Hammond</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: #83c9f4; background: #000; font: 16px system-ui, sans-serif; }
  main { min-height: 100dvh; display: grid; grid-template-rows: 1fr auto 1fr; padding: clamp(24px, 6vw, 88px); }
  h1 { grid-row: 2; width: min(100%, 980px); margin: 0 auto; }
  h1 svg { display: block; width: 100%; height: auto; overflow: visible; }
  main { overflow-x: clip; }
  @media (prefers-reduced-motion: no-preference) {
    .intro-title { --entrance-offset: -42px; animation: letter-entrance 640ms ease-out both; }
    .intro-byline { --entrance-offset: 38px; animation: letter-entrance 640ms ease-out 180ms both; }
    form { animation: login-entrance 500ms ease-out 880ms both; }
    form:focus-within, form:has(.error:not([hidden])) { animation: none; }
  }
  @keyframes login-entrance {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes letter-entrance {
    from { opacity: 0; transform: translateX(var(--entrance-offset)); }
    to { opacity: 1; transform: translateX(0); }
  }
  form { grid-row: 3; align-self: end; justify-self: center; width: min(100%, 350px); margin-top: clamp(18px, 4vh, 44px); }
  label { display: grid; justify-items: center; margin-bottom: 12px; }
  label svg { display: block; width: 72px; height: auto; }
  .field { display: flex; border: 1px solid #527e99; border-radius: 8px; overflow: hidden; }
  input, button { font: inherit; }
  input { min-width: 0; flex: 1; border: 0; color: #83c9f4; background: #0b1118; padding: 14px 16px; }
  button { width: 54px; border: 0; color: #000; background: #83c9f4; font-size: 20px; cursor: pointer; }
  :focus-visible { outline: 2px solid #fff; outline-offset: -3px; }
  .error { margin: 8px 0 0; color: #ace0ff; }
</style>
</head>
<body>

  </svg></h1>
  <form>
    <label for="password" aria-label="Login">
      <svg aria-hidden="true" viewBox="4 0 238 60" fill="none" stroke="#83c9f4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 8L11 52 43 51 M71 7Q53 8 52 29Q51 51 70 53Q89 54 91 30Q92 8 71 7Z"/>
        <path d="M142 13Q133 4 121 8Q104 12 104 33Q104 54 124 53Q141 53 142 33L128 34"/>
        <path d="M158 9L181 8M170 9L170 51M158 52L181 51 M198 52L198 8 235 51 236 8"/>
      </svg>
    </label>
    <div class="field">
      <input id="password" type="password" autocomplete="current-password" autocapitalize="none" required>
      <button type="submit" aria-label="Sign in">→</button>
    </div>
    <p class="error" role="alert" hidden></p>
  </form>
</main>
<script>
  const form = document.querySelector('form');
  const password = document.querySelector('#password');
  const error = document.querySelector('.error');

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    if (password.value !== 'hatchet') {
      error.textContent = 'Incorrect password. Try again.';
      error.hidden = false;
      password.focus();
      password.select();
      return;
    }

    sessionStorage.setItem('paragraphs-unlocked', 'yes');
    window.location.assign('./presentation/');
  });
</script>

</html>
